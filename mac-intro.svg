<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" role="img" aria-label="Juan Manuel Gonzalez - Cloud and Backend Developer, Data Engineer">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a31"/>
      <stop offset="1" stop-color="#1a1d23"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#191c21"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="262" y="160" width="0" height="32">
        <animate attributeName="width" from="0" to="300" begin="0.6s" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="450" cy="446" rx="250" ry="14" fill="#000000" opacity="0.18"/>

  <!-- ===================== SCREEN / LID ===================== -->
  <rect x="225" y="40" width="450" height="300" rx="16" fill="url(#lid)" stroke="#2f343d" stroke-width="1.5"/>
  <rect x="239" y="54" width="422" height="272" rx="6" fill="#0b0e13"/>
  <circle cx="450" cy="47" r="2.2" fill="#3a4048"/>

  <!-- window bar -->
  <circle cx="262" cy="73" r="5" fill="#3a4048"/>
  <circle cx="281" cy="73" r="5" fill="#3a4048"/>
  <circle cx="300" cy="73" r="5" fill="#3a4048"/>
  <text x="450" y="77" text-anchor="middle" font-size="12.5" fill="#565f6b">juanmanueldev.website</text>
  <line x1="239" y1="90" x2="661" y2="90" stroke="#1b2027" stroke-width="1"/>

  <!-- line 1: $ whoami -->
  <text x="262" y="142" font-size="18"><tspan fill="#4285F4">$</tspan><tspan fill="#7d8590"> whoami</tspan></text>

  <!-- line 2: name typed out -->
  <g clip-path="url(#typeClip)">
    <text x="262" y="184" font-size="24" font-weight="600" fill="#4285F4">Juan Manuel González</text>
  </g>
  <!-- typing cursor -->
  <rect y="164" width="12" height="26" fill="#4285F4">
    <animate attributeName="x" from="262" to="552" begin="0.6s" dur="1.8s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.5s" dur="0.3s" fill="freeze"/>
  </rect>

  <!-- lines 3 & 4 appear after the name is typed -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>

    <!-- line 3: // role (cycles) -->
    <text x="262" y="240" font-size="19" fill="#565f6b">// </text>
    <text x="298" y="240" font-size="19" fill="#cfd6dd" opacity="0">Cloud &amp; Backend Developer
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.30;0.35;0.95;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="298" y="240" font-size="19" fill="#cfd6dd" opacity="0">Data Engineer · Python · Spark
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.37;0.63;0.68;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="298" y="240" font-size="19" fill="#cfd6dd" opacity="0">Automation &amp; AWS · APIs REST
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.70;0.95;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </text>

    <!-- line 4: idle prompt with blinking cursor -->
    <text x="262" y="292" font-size="18" fill="#4285F4">$</text>
    <rect x="282" y="275" width="11" height="22" fill="#4285F4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite" begin="3s"/>
    </rect>
  </g>

  <!-- ===================== BASE / DECK ===================== -->
  <path d="M198 340 H702 L742 372 Q746 380 738 380 H162 Q154 380 158 372 Z" fill="url(#base)" stroke="#2f343d" stroke-width="1"/>
  <rect x="420" y="340" width="60" height="5" rx="2.5" fill="#0b0e13"/>
  <line x1="164" y1="379" x2="736" y2="379" stroke="#3d434c" stroke-width="1"/>
</svg>
